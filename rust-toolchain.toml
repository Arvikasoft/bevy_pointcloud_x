[toolchain]
# Same pin as bevy_3d_tiles and TurboTwin. The bevy 0.20 facade declares
# rust-version = 1.97.1; the bevy subcrates used here declare 1.95.0 at most.
channel = "1.97.1"
targets = ["wasm32-unknown-unknown"]
# CI installs components for its default toolchain, but this file overrides the
# channel at cargo time — declare them here so rustup provisions the pinned
# toolchain completely (the fmt/clippy jobs are gated).
components = ["rustfmt", "clippy"]
