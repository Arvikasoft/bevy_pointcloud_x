[package]
name = "bevy_pointcloud_x"
version = "0.2.0"
edition = "2024"
repository = "https://github.com/Arvikasoft/bevy_pointcloud_x"
license = "MIT"
description = "Potree-style point-cloud rendering for Bevy (EDL shading, octree LOD) — a crates.io-publishable fork of rlamarche/bevy_pointcloud with WebGPU/MSAA fixes."
readme = "README.md"
keywords = ["bevy", "point-cloud", "lidar", "potree", "rendering"]
categories = ["rendering", "game-development"]
resolver = "2"

# Fork of github.com/rlamarche/bevy_pointcloud @ 4c16ead (MIT — LICENSE
# preserved). Renamed for crates.io: upstream is git-only and its potree/copc
# loader features carry git dependencies (potree-rs, copc-streaming) that
# crates.io forbids, so it cannot publish under its own name — and the rename
# leaves `bevy_pointcloud` to upstream. Those features are REMOVED here (their
# cfg'd code stays inert; see [lints]); the in-memory `PointCloud` asset,
# octree renderer, EDL shading, and LAS/PLY loaders remain. TurboTwin patches
# on top (grep "TurboTwin vendor patch"): normalize-pass color target
# specialized on the view target's format (0.19: ExtractedView::target_format),
# the atmosphere mesh-view-layout bit on the depth/attribute pipeline keys,
# f16 depth/attribute intermediates (WebGPU still guarantees neither MSAA on
# rg32float/rgba32float nor blending on any 32-bit float target without the
# optional float32-blendable feature — re-verified against wgpu 29),
# attribute/depth passes match the view's MSAA sample count, and a
# screen-space minimum point size in the simple (non-octree) path.

[lib]
crate-type = ["lib"]

[lints.rust]
# Upstream potree/copc/wasm_worker cfg blocks remain in-source; their features
# (and git deps) are removed for crates.io publishability.
unexpected_cfgs = "allow"

[dependencies]
bevy_app = { version = "=0.19.0" }
bevy_camera = { version = "=0.19.0" }
bevy_ecs = { version = "=0.19.0" }
bevy_pbr = { version = "=0.19.0" }
bevy_render = { version = "=0.19.0" }
bevy_core_pipeline = { version = "=0.19.0" }
bevy_asset = { version = "=0.19.0" }
bevy_log = { version = "=0.19.0" }
bevy_math = { version = "=0.19.0" }
bevy_mesh = { version = "=0.19.0" }
bevy_shader = { version = "=0.19.0" }
bevy_derive = { version = "=0.19.0" }
bevy_reflect = { version = "=0.19.0" }
bevy_transform = { version = "=0.19.0" }
bevy_platform = { version = "=0.19.0" }
bevy_utils = { version = "=0.19.0" }
bevy_image = { version = "=0.19.0" }
bevy_color = { version = "=0.19.0" }
bevy_diagnostic = { version = "=0.19.0" }
bevy_time = { version = "=0.19.0" }
bevy_tasks = { version = "=0.19.0" }

smallvec = { version = "1", default-features = false }
indexmap = { version = "2.5.0", default-features = false }

bytemuck = "1"
thiserror = "2.0"
serde = { version = "1", features = ["derive"] }
las = { version = "0.9", features = ["laz"], optional = true }
ply-rs = { version = "0.1.3", optional = true }

# Octree
slab = "0.4"
offset-allocator = "0.2.0"
crossbeam = { version = "0.8", features = [
    "crossbeam-channel",
    "crossbeam-queue",
] }
async-trait = "0.1"
ordered-float = "5.1.0"
priority-queue = "2.7.0"

[features]
default = ["las", "ply"]
trace = []
multi_threaded = []
webgl = [
    "bevy_core_pipeline/webgl",
    "bevy_pbr/webgl",
    "bevy_render/webgl",
]
webgpu = []
ply = ["dep:ply-rs"]
las = ["dep:las"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3.2", default-features = false, features = ["wasm_js"] }
